name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true
routes = [{ pattern = "letter.51vipai.com", custom_domain = true }]

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "cloud-mail"
database_id = "5617ea54-2ae9-4ba2-8082-cf9076f17311"

[[kv_namespaces]]
binding = "kv"
id = "783b1bf736d14a87b4298b06c4f7f8fe"

[[r2_buckets]]
binding = "r2"
bucket_name = "cloud-mail-r2"

#[[send_email]]
#name = "email"			#CF发件, 配置后优先使用

[[send_email]]
name = "forward"		#站内转发到已验证的其他邮箱，不限制单个地址

[ai]
binding = "ai"

[assets]
binding = "assets"		#静态资源绑定名默认不可修改
directory = "./dist"	#前端vue项目打包的静态资源存放位置,默认dist
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/oss/*", "/static/*", "/attachments/*"]

[triggers]
crons = ["0 * * * *"]	#每小时执行；resetDaySendCount 仅在 UTC 0 点生效


[vars]
#ai_model = ""			#ai模型,不填默认使用@cf/meta/llama-3.1-8b-instruct-fast
#analysis_cache = false			#是否开启分析数据缓存
#orm_log = false			#是否sql日志
domain = ["51vipai.com"]
admin = "admin@51vipai.com"
jwt_secret = "填写你的密钥"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
